<!-- Shared profile drawer for the test consoles (members, staff, trainers).
     Included by gym_core/console.html and gym_ops/console.html. Needs the page's call() and $(). -->
<style>
#pf-bg{position:fixed;inset:0;background:var(--overlay);z-index:50;display:none}#pf-bg.on{display:block}
#fdp{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--bg);z-index:51;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);border-left:1px solid var(--bd)}
#fdp:not(.on){box-shadow:none;visibility:hidden;transition:transform .2s ease,visibility 0s .2s}
#fdp.on{transform:none}
#fdp .pf-head{background:var(--surface);border-bottom:1px solid var(--bd);padding:16px 20px 0}
#fdp .pf-top{display:flex;gap:14px;align-items:center}
#fdp .pf-av{width:52px;height:52px;border-radius:50%;background:var(--pl);color:var(--p-t);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
#fdp .pf-name{font-size:18px;font-weight:700;margin:0}#fdp .pf-x{margin-left:auto;height:34px;width:34px;padding:0;font-size:18px}
#fdp .pf-tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto}
#fdp .pf-tabs a{padding:9px 9px;font-size:12.5px;border-bottom:2px solid transparent;color:var(--t2);font-weight:600;cursor:pointer;white-space:nowrap}
#fdp .pf-tabs a.on{color:var(--p-t);border-color:var(--p)}
#fdp .pf-body{flex:1;overflow:auto;padding:16px 20px 30px}
#fdp .pf-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px}
#fdp .pf-kpi{background:var(--surface);border:1px solid var(--bd);border-radius:12px;padding:10px}#fdp .pf-kpi span{color:var(--t2);font-size:11px}#fdp .pf-kpi b{display:block;font-size:16px;margin-top:2px;line-height:1.25;word-break:break-word}
#fdp dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0}#fdp dt{color:var(--t2)}#fdp dd{margin:0;font-weight:500;word-break:break-word}
#fdp .pf-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
#fdp .pf-cal div{border-radius:8px;padding:6px 4px;text-align:center;font-size:11px;background:var(--surface);border:1px solid var(--bd);min-height:48px}
#fdp .pf-cal b{display:block;font-size:12px}
#fdp .s-Present{background:var(--okl)!important;border-color:var(--ok)!important;color:var(--ok-t)}#fdp .s-Half{background:var(--wnl)!important;border-color:var(--wn)!important;color:var(--wn-t)}
#fdp .s-Absent{background:var(--dgl)!important;border-color:var(--dg)!important;color:var(--dg-t)}#fdp .s-Paid,#fdp .s-Weekly,#fdp .s-Holiday{background:var(--pl)!important;color:var(--p-t);border-color:var(--p)!important}
#fdp .pf-bars{display:flex;align-items:flex-end;gap:8px;height:130px;border-bottom:1px solid var(--bd);padding-top:18px}
#fdp .pf-bars div{flex:1;background:var(--p);border-radius:5px 5px 0 0;position:relative;min-height:2px}
#fdp .pf-bars span{position:absolute;top:-16px;left:-10px;right:-10px;text-align:center;font-size:10px;color:var(--t2)}
#fdp .pf-lab{display:flex;gap:8px}#fdp .pf-lab span{flex:1;text-align:center;font-size:10px;color:var(--t2)}
#fdp .pf-ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}#fdp .pf-ph img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--bd)}
#fdp tr.click{cursor:pointer}#fdp tr.click:hover td{background:var(--hover)}
#fdp .pf-note{background:var(--wnl);color:var(--wn-t);border-radius:9px;padding:9px 11px;font-size:12px}
.pf-open{color:var(--p-t);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--p)}
</style>
<div id="pf-bg" onclick="pfClose()"></div>
<div id="fdp" role="dialog" aria-modal="true">
 <div class="pf-head"><div class="pf-top"><div class="pf-av" id="pf-av"></div><div><p class="pf-name" id="pf-name"></p><div class="muted" id="pf-sub"></div></div><button class="pf-x" onclick="pfClose()" title="Close">×</button></div>
 <div class="pf-tabs" id="pf-tabs"></div></div>
 <div class="pf-body"><div class="msg" id="pf-msg"></div><div id="pf-content"></div></div>
</div>
<script>
const PF={kind:null,id:null,data:null,tab:null,month:null};
// Move the drawer to <body> so a hidden page section around the include can never hide it.
document.body.appendChild(document.getElementById("pf-bg"));document.body.appendChild(document.getElementById("fdp"));
const pfR=x=>"₹"+Number(x||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const pfE=v=>(v===null||v===undefined||v==="")?'<span class="muted">—</span>':String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pfV=v=>(v===null||v===undefined)?"":String(v).replace(/"/g,"&quot;");
const pfC={active:"c-ok",Paid:"c-ok",Present:"c-ok",Active:"c-ok",Converted:"c-ok",frozen:"c-wn",upcoming:"c-wn",expiring:"c-wn","Partially Paid":"c-wn","Half Day":"c-wn",Draft:"c-wn",expired:"c-dg",Pending:"c-dg",cancelled:"c-dg",Absent:"c-dg",inactive:"c-dg",no_plan:""};
const pfChip=t=>`<span class="chip ${pfC[t]||"c-p"}">${String(t).replace("_"," ")}</span>`;
const pfErrT=j=>`${j.message||"Error"} [${j.status} · ${j.error}]`;
const pfWa=p=>p?`<a class="link" target="_blank" href="https://wa.me/${String(p).replace(/\D/g,"").replace(/^(\d{10})$/,"91$1")}">${pfE(p)} ↗</a>`:pfE(p);
const pfDate=d=>d?new Date(d).toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
function pfSay(t,ok){const m=$("pf-msg");m.textContent=t;m.className="msg show "+(ok?"ok":"err")}
function pfShow(){$("fdp").classList.add("on");$("pf-bg").classList.add("on")}
function pfClose(){$("fdp").classList.remove("on");$("pf-bg").classList.remove("on");PF.kind=null}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&PF.kind)pfClose()});
function pfHead(name,sub,tabs){$("pf-av").textContent=(name||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();$("pf-name").innerHTML=pfE(name);$("pf-sub").innerHTML=sub;
 $("pf-tabs").innerHTML=tabs.map(([k,l])=>`<a data-t="${k}" class="${k===PF.tab?"on":""}" onclick="pfTab('${k}')">${l}</a>`).join("")}
function pfTab(t){PF.tab=t;document.querySelectorAll("#pf-tabs a").forEach(a=>a.classList.toggle("on",a.dataset.t===t));$("pf-msg").className="msg";({member:pfMemberTab,staff:pfStaffTab,trainer:pfTrainerTab})[PF.kind](t)}
const pfKpis=a=>`<div class="pf-kpis">${a.map(([l,v])=>`<div class="pf-kpi"><span>${l}</span><b>${v}</b></div>`).join("")}</div>`;
const pfDl=a=>`<dl>${a.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
const pfCard=(t,h,extra)=>`<div class="card">${t?`<h3>${t}${extra||""}</h3>`:""}${h}</div>`;
const pfField=(id,l,v,type)=>type==="ta"?`<div style="grid-column:1/-1"><label>${l}</label><textarea id="pfe_${id}">${(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}</textarea></div>`:`<div><label>${l}</label><input id="pfe_${id}" type="${type||"text"}" value="${pfV(v)}"></div>`;
const pfSel=(id,l,v,opts)=>`<div><label>${l}</label><select id="pfe_${id}">${opts.map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select></div>`;
const pfGet=id=>$("pfe_"+id).value;
async function pfLazy(url){const j=await call("GET",url);if(!j.ok)return {denied:true,text:j.status===403?"Your role can't see this.":pfErrT(j)};return j}

/* ---------------- MEMBER ---------------- */
async function openMember(id,tab){PF.kind="member";PF.id=id;PF.tab=tab||"over";$("pf-content").innerHTML='<div class="muted">Loading…</div>';$("pf-msg").className="msg";pfShow();
 const j=await call("GET","members/"+id+"/");if(!j.ok){$("pf-content").innerHTML="";return pfSay(pfErrT(j))}PF.data=j.member;const m=j.member;
 pfHead(m.name,`${pfE(m.code)} · ${pfE(m.phone)} · ${pfChip(m.status)}${m.is_archived?" "+pfChip("archived"):""}`,
  [["over","Overview"],["ms","Memberships"],["bills","Bills & payments"],["visits","Visits"],["fit","Fitness & progress"],["diet","Diet"],["consent","Consent"],["ref","Referrals"]]);pfTab(PF.tab)}
async function pfMemberTab(t){const m=PF.data,el=$("pf-content");
 if(t==="over"){const cur=m.memberships.find(x=>x.is_current&&x.status==="active");
  el.innerHTML=pfKpis([["Status",pfChip(m.status)],["Plan",pfE(m.plan)],["Ends",m.end_date&&typeof fmtD==="function"?fmtD(m.end_date):pfE(m.end_date)],["Days left",m.days_left!=null&&m.status!=="expired"?m.days_left:"—"],["Dues",pfR(m.dues)],["Visits (this month)",`${m.visits.total} (${m.visits.this_month})`]])+
  pfCard("Personal details",pfDl([["Member code",pfE(m.code)],["Mobile",pfWa(m.phone)],["Email",pfE(m.email)],["Gender",pfE(m.gender)],["Date of birth",m.date_of_birth?`${m.date_of_birth}${m.age?` (${m.age} yrs)`:""}`:pfE(null)],["Address",pfE(m.address)],["Emergency contact",pfE(m.emergency_contact)],["Fingerprint ID (eSSL)",pfE(m.biometric_id)],["Trainer",pfE(cur&&cur.trainer?cur.trainer.name:m.trainer)],["Last visit",m.visits.last?pfDate(m.visits.last):"—"],["Joined on",pfDate(m.created_at)],["Notes",pfE(m.notes)]]),` <button class="sm" style="float:right" onclick="pfMemberEdit()">Edit</button>`)+
  `<div class="row">${typeof startBill==="function"?`<button class="pr" onclick="pfClose();startBill('${m.code}','${m.status==="no_plan"?"new":"renewal"}')">${m.status==="no_plan"?"New bill":"Renew"}</button>`:""}<button onclick="pfTab('fit')">Fitness & progress</button><button onclick="pfTab('diet')">Diet plan</button>${typeof goConsent==="function"?`<button onclick="pfClose();goConsent('${m.id}')">Consent form</button>`:""}${typeof removeMember==="function"&&can("members","delete")?`<button class="ghost" style="margin-left:auto" onclick="removeMember('${m.id}')">${m.is_archived?"Restore / remove…":"Remove member…"}</button>`:""}</div>`}
 else if(t==="ms"){el.innerHTML=pfCard("Membership history",`<table><thead><tr><th>Plan</th><th>Dates</th><th>Trainer</th><th>PT sessions</th><th>Freezes</th><th></th></tr></thead><tbody>${m.memberships.map(x=>`<tr><td><b>${pfE(x.plan.name)}</b><br><span class="muted">${x.receipt_no}</span> ${x.status==="cancelled"?pfChip("cancelled"):x.is_current?pfChip("active"):""}</td><td>${x.start_date} → <b>${x.end_date}</b>${x.end_date!==x.original_end_date?`<br><span class="muted">was ${x.original_end_date}</span>`:""}</td><td>${x.trainer?`<span class="pf-open" onclick="openTrainer(${x.trainer.id})">${pfE(x.trainer.name)}</span>`:"—"}</td><td>${x.sessions?`${x.sessions.used} / ${x.sessions.total}<br><span class="muted">${x.sessions.left} left</span>`:"—"}</td><td>${x.freezes.map(f=>`${f.start_date} · ${f.days}d<br><span class="muted">${pfE(f.reason)}</span>`).join("<br>")||"—"}</td><td>${x.status==="active"&&(x.is_current||x.start_date>new Date().toISOString().slice(0,10))?`<button class="sm" onclick="pfFreeze('${x.id}')">Freeze</button>${x.sessions&&x.sessions.left>0?` <button class="sm" onclick="pfSession('${x.id}')">Log session</button>`:""}`:""}</td></tr>`).join("")||`<tr><td colspan=6 class="muted">No membership yet.</td></tr>`}</tbody></table>`)}
 else if(t==="bills"){if(!m.bills){el.innerHTML=`<div class="pf-note">Your role can't see bills.</div>`;return}
  const tot=m.bills.filter(b=>b.status!=="cancelled").reduce((a,b)=>[a[0]+Number(b.total),a[1]+Number(b.paid)],[0,0]);
  el.innerHTML=pfKpis([["Bills",m.bills.length],["Billed",pfR(tot[0])],["Paid",pfR(tot[1])],["Dues",pfR(m.dues)]])+pfCard("Bills",`<table><thead><tr><th>Receipt</th><th>Plan</th><th>Total</th><th>Paid</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>${m.bills.map(b=>`<tr><td><b>${b.receipt_no}</b><br><span class="muted">${b.created_at.slice(0,10)}</span></td><td>${pfE(b.plan.name)}</td><td>${pfR(b.total)}</td><td>${pfR(b.paid)}</td><td>${pfR(b.remaining)}</td><td>${pfChip(b.status==="cancelled"?"cancelled":b.payment_status)}</td><td style="white-space:nowrap"><button class="sm" onclick="pfReceipt('${b.id}')">Receipt</button>${typeof emailDlg==="function"?` <button class="sm" onclick="pfClose();emailDlg('receipt','${b.id}','${m.id}')">Email</button>`:""}</td></tr><tr><td colspan=7 class="muted" style="padding-top:0">${b.payments.map(p=>`${p.paid_on} · ${pfR(p.amount)} ${p.mode}${p.reference_no?" · "+pfE(p.reference_no):""}${p.received_by?" · by "+pfE(p.received_by):""}`).join("<br>")||"No payment yet"}</td></tr>`).join("")||`<tr><td colspan=7 class="muted">No bills</td></tr>`}</tbody></table>`)}
 else if(t==="visits"){const v=m.visits;el.innerHTML=pfKpis([["Total visits",v.total],["This month",v.this_month],["Last visit",v.last?new Date(v.last).toLocaleDateString("en-IN"):"—"]])+pfCard("Last 20 check-ins",`<table><thead><tr><th>Date</th><th>Time</th><th>How</th><th>By</th></tr></thead><tbody>${(v.recent||[]).map(c=>`<tr><td>${c.date}</td><td>${new Date(c.at).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}</td><td>${c.source.replace("_"," ")}${c.override_reason?`<br><span class="chip c-wn">let in: ${pfE(c.override_reason)}</span>`:""}</td><td>${pfE(c.by)}</td></tr>`).join("")||`<tr><td colspan=4 class="muted">No visits yet</td></tr>`}</tbody></table>`)}
 else if(t==="fit"){el.innerHTML='<div class="muted">Loading…</div>';const f=m.fitness||{};const p=await pfLazy(`members/${m.id}/progress/`);
  let prog;if(p.denied)prog=`<div class="pf-note">${p.text}</div>`;else{const ws=p.weight_series.slice(-10);const mx=Math.max(...ws.map(w=>+w.weight_kg),1),mn=Math.min(...ws.map(w=>+w.weight_kg),mx)-2;
   prog=(ws.length?`<div class="pf-bars">${ws.map(w=>`<div style="height:${Math.max(6,(w.weight_kg-mn)/(mx-mn||1)*100)}%"><span>${w.weight_kg}</span></div>`).join("")}</div><div class="pf-lab">${ws.map(w=>`<span>${w.date.slice(5)}</span>`).join("")}</div>${p.target_weight_kg?`<div class="muted" style="margin-top:6px">Target ${p.target_weight_kg} kg</div>`:""}`:`<div class="muted">No weight entries yet.</div>`)+
   `<table style="margin-top:12px"><thead><tr><th>Date</th><th>Weight</th><th>Body fat</th><th>Chest / waist / hips</th><th>Arms / thighs</th><th>By</th></tr></thead><tbody>${p.entries.slice().reverse().map(e=>`<tr><td>${e.date}${e.has_photo?" 📷":""}</td><td>${pfE(e.weight_kg)}</td><td>${e.body_fat_percent?e.body_fat_percent+"%":"—"}</td><td>${[e.chest_cm,e.waist_cm,e.hips_cm].map(x=>x||"—").join(" / ")}</td><td>${[e.arms_cm,e.thighs_cm].map(x=>x||"—").join(" / ")}</td><td>${pfE(e.recorded_by)}</td></tr>`).join("")||`<tr><td colspan=6 class="muted">No entries</td></tr>`}</tbody></table><div class="pf-ph" id="pf-photos"></div>`}
  el.innerHTML=pfCard("Fitness profile",(m.fitness?pfDl([["Goal",pfE(f.fitness_goal)],["Weight now / target",`${pfE(f.current_weight_kg)} kg → ${pfE(f.target_weight_kg)} kg`],["Height",f.height_cm?f.height_cm+" cm":pfE(null)],["Activity level",pfE(f.activity_level)],["Workout days / week",pfE(f.workout_days_per_week)],["Workout time",pfE(f.workout_time)],["Diet type",pfE(f.diet_type)],["Meals per day",pfE(f.meals_per_day)],["Allergies",pfE(f.food_allergies)],["Food preferences",pfE(f.food_preferences)],["Target date",pfE(f.target_date)]]):`<div class="muted">No fitness profile yet.</div>`),typeof fitnessFields==="function"?` <button class="sm" style="float:right" onclick="pfFitEdit()">${m.fitness?"Edit":"Add"}</button>`:"")+pfCard("Progress",prog,typeof goProgress==="function"?` <button class="sm" style="float:right" onclick="pfClose();goProgress('${m.id}')">+ Add entry</button>`:"");
  if(!p.denied)for(const e of p.entries.filter(e=>e.has_photo).slice(-6)){try{const r=await fetch(API+`progress/${e.id}/photo/`,{headers:{Authorization:"Bearer "+tok()}});if(r.ok){const img=document.createElement("img");img.src=URL.createObjectURL(await r.blob());img.title=e.date;$("pf-photos")&&$("pf-photos").appendChild(img)}}catch(x){}}}
 else if(t==="diet"){el.innerHTML='<div class="muted">Loading…</div>';const d=await pfLazy(`diet/plans/?member_id=${m.id}`);
  el.innerHTML=d.denied?`<div class="pf-note">${d.text}</div>`:pfCard("Diet plans",`<table><thead><tr><th>Plan</th><th>Status</th><th>Version</th><th>Dates</th><th>Review</th><th>Trainer</th><th></th></tr></thead><tbody>${d.plans.map(p=>`<tr><td><b>${pfE(p.name)}</b><br><span class="muted">${pfE(p.goal)} · ${pfE(p.diet_type)}</span></td><td>${pfChip(p.status)}</td><td>v${p.current_version}</td><td>${pfE(p.start_date)} → ${pfE(p.end_date)}</td><td>${pfE(p.review_date)}</td><td>${p.trainer?pfE(p.trainer.name):"—"}</td><td style="text-align:right;white-space:nowrap">${typeof dietPdf==="function"?`<button class="sm" onclick="dietPdf(${p.id})">PDF</button> ${typeof emailDlg==="function"?`<button class="sm" onclick="pfClose();emailDlg('diet',${p.id},'${m.id}')">Email</button> `:""}<button class="sm wa" onclick="shareDiet(${p.id})">WhatsApp</button>`:""}</td></tr>`).join("")||`<tr><td colspan=7 class="muted">No diet plan yet.</td></tr>`}</tbody></table>`)}
 else if(t==="consent"){el.innerHTML='<div class="muted">Loading…</div>';const c=await pfLazy(`members/${m.id}/consent/`);
  el.innerHTML=c.denied?`<div class="pf-note">${c.text}</div>`:(c.signed.length?c.signed.map(s=>pfCard(`Signed ${pfDate(s.signed_at)}`,pfDl([["Signed by",pfE(s.signed_name)],["Witnessed by",pfE(s.witnessed_by)],["Health answers",Object.entries(s.health_answers||{}).map(([k,v])=>`${pfE(k)}: <b>${pfE(String(v))}</b>`).join("<br>")||"—"]])+(s.signature_png?`<img src="${s.signature_png}" style="margin-top:8px;max-width:260px;border:1px solid var(--bd);border-radius:8px;background:var(--surface)">`:""))).join(""):`<div class="pf-note">No consent form signed yet.</div>`)+(typeof goConsent==="function"?`<div class="row"><button class="pr" onclick="pfClose();goConsent('${m.id}')">${c.signed&&c.signed.length?"Sign again":"Sign consent form"}</button></div>`:"")}
 else if(t==="ref"){el.innerHTML='<div class="muted">Loading…</div>';const r=await pfLazy(`members/${m.id}/referrals/`);
  el.innerHTML=r.denied?`<div class="pf-note">${r.text}</div>`:pfCard("People this member referred",`<table><thead><tr><th>Name</th><th>Enquiry date</th><th>Status</th><th>Reward</th></tr></thead><tbody>${r.referrals.map(x=>`<tr><td>${pfE(x.name)}</td><td>${x.date}</td><td>${pfChip(x.status)}</td><td>${x.reward?`${x.reward.days} days · ${x.reward.status}`:"—"}</td></tr>`).join("")||`<tr><td colspan=4 class="muted">No referrals yet.</td></tr>`}</tbody></table>`)}}
function pfMemberEdit(){const m=PF.data;$("pf-content").innerHTML=pfCard("Edit member",`<div class="grid">${pfField("name","Name",m.name)}${pfField("phone","Mobile",m.phone)}${pfField("email","Email",m.email)}${pfSel("gender","Gender",m.gender,["Male","Female","Other"])}${pfField("date_of_birth","Date of birth",m.date_of_birth,"date")}${pfField("emergency_contact","Emergency contact",m.emergency_contact)}${pfField("biometric_id","Fingerprint ID (eSSL)",m.biometric_id)}${pfField("address","Address",m.address,"ta")}${pfField("notes","Notes",m.notes,"ta")}</div><div class="row"><button class="pr" onclick="pfMemberSave()">Save</button><button onclick="pfTab('over')">Cancel</button></div>`)}
async function pfMemberSave(){const b={version:PF.data.version};["name","phone","email","gender","emergency_contact","biometric_id","address","notes"].forEach(k=>b[k]=pfGet(k));b.date_of_birth=pfGet("date_of_birth")||null;
 const j=await call("POST",`members/${PF.id}/update/`,b);if(!j.ok)return pfSay(j.error==="edit_conflict"?"Someone else changed this member just now. Close and open the profile again.":pfErrT(j));await openMember(PF.id,"over");pfSay("Saved.",true);if(typeof loadMembers==="function")loadMembers()}
function pfFitEdit(){modal(`Fitness profile · ${pfE(PF.data.name)}`,`<div class="grid">${fitnessFields(PF.data.fitness)}</div><div class="msg" id="fitmsg"></div>`,`<button onclick="closeModal()">Cancel</button><button class="pr" onclick="pfFitSave()">Save</button>`)}
async function pfFitSave(){const j=await call("POST",`members/${PF.id}/fitness/`,fitnessBody());if(!j.ok)return say("fitmsg",j.message);closeModal();await openMember(PF.id,"fit");pfSay("Fitness profile saved.",true)}
async function pfFreeze(mid){const days=prompt("Freeze for how many days?","7");if(!days)return;const reason=prompt("Reason?","Travel")||"";const j=await call("POST",`memberships/${mid}/freeze/`,{days:+days,reason});if(!j.ok)return pfSay(pfErrT(j));await openMember(PF.id,"ms");pfSay("Frozen.",true)}
async function pfSession(mid){const j=await call("POST",`memberships/${mid}/sessions/`,{});if(!j.ok)return pfSay(pfErrT(j));await openMember(PF.id,"ms");pfSay("Session logged.",true)}
async function pfReceipt(id){const r=await fetch(API+`bills/${id}/receipt/`,{headers:{Authorization:"Bearer "+tok()}});const h=await r.text();const w=window.open("","_blank");w.document.write(h);w.document.close()}

/* ---------------- TRAINER ---------------- */
async function openTrainer(id,tab){PF.kind="trainer";PF.id=id;PF.tab=tab||"over";$("pf-content").innerHTML='<div class="muted">Loading…</div>';$("pf-msg").className="msg";pfShow();
 const j=await call("GET","trainers/"+id+"/");if(!j.ok){$("pf-content").innerHTML="";pfHead("Trainer","",[]);return pfSay(pfErrT(j))}PF.data=j.trainer;const t=j.trainer;
 pfHead(t.name,`${pfE(t.code)} · ${pfE(t.phone)} · ${pfChip(t.status)}${t.specialization?" · "+pfE(t.specialization):""}`,[["over","Overview"],["clients",`Clients (${t.clients.length})`],["sess","Sessions"],...(t.money_visible?[["earn","PT earnings"]]:[])]);pfTab(PF.tab)}
function pfTrainerTab(t){const r=PF.data,el=$("pf-content");
 if(t==="over"){el.innerHTML=pfKpis([["Active clients",r.clients.filter(c=>!c.upcoming).length],["Starting soon",r.clients.filter(c=>c.upcoming).length],["Past clients",r.past_clients],["Sessions this month",r.sessions.this_month],...(r.money_visible?[["PT share this month",pfR(r.earnings.this_month)]]:[])])+
  pfCard("Details",pfDl([["Trainer code",pfE(r.code)],["Mobile",pfWa(r.phone)],["Gender",pfE(r.gender)],["Specialisation",pfE(r.specialization)],["Joined",pfE(r.joining_date)],["Status",pfChip(r.status)],["Sign-in login",r.login?pfE(r.login.name):'<span class="muted">Not linked: this trainer can\'t sign in to see their clients</span>'],["Staff record",r.staff_record?(typeof openStaff==="function"?`<span class="pf-open" onclick="openStaff(${r.staff_record.id})">${pfE(r.staff_record.code)} · ${pfE(r.staff_record.designation)}</span>`:`${pfE(r.staff_record.code)} · ${pfE(r.staff_record.designation)}`):'<span class="muted">None (no salary / payroll)</span>']]),` <button class="sm" style="float:right" onclick="pfTrainerEdit()">Edit</button>`)}
 else if(t==="clients"){el.innerHTML=pfCard("Current clients",`<table><thead><tr><th>Member</th><th>Plan</th><th>Dates</th><th>Days left</th><th>Sessions</th></tr></thead><tbody>${r.clients.map(c=>`<tr class="click" onclick="openMember('${c.member.id}')"><td><b>${pfE(c.member.name)}</b><br><span class="muted">${c.member.code} · ${c.member.phone}</span></td><td>${pfE(c.plan)}</td><td>${c.start_date} → ${c.end_date}</td><td>${c.upcoming?pfChip("upcoming"):c.days_left}</td><td>${c.sessions?`${c.sessions.used}/${c.sessions.total}`:"—"}</td></tr>`).join("")||`<tr><td colspan=5 class="muted">No current clients.</td></tr>`}</tbody></table><div class="muted" style="margin-top:8px">Click a client to open their profile. Past clients: ${r.past_clients}.</div>`)}
 else if(t==="sess"){el.innerHTML=pfKpis([["This month",r.sessions.this_month],["All time",r.sessions.total]])+pfCard("Last 15 sessions",`<table><thead><tr><th>Date</th><th>Member</th><th>Notes</th></tr></thead><tbody>${r.sessions.recent.map(s=>`<tr><td>${s.date}</td><td>${pfE(s.member)} <span class="muted">${s.member_code}</span></td><td>${pfE(s.notes)}</td></tr>`).join("")||`<tr><td colspan=3 class="muted">No sessions logged.</td></tr>`}</tbody></table>`)}
 else if(t==="earn"){const e=r.earnings,bm=e.by_month.slice().reverse(),mx=Math.max(...bm.map(x=>+x.trainer_share),1);
  el.innerHTML=pfKpis([["This month",pfR(e.this_month)],["All time share",pfR(e.all_time)],["PT money collected",pfR(e.pt_sales_all_time)]])+pfCard("Trainer share, last 6 months",`<div class="pf-bars">${bm.map(x=>`<div style="height:${Math.max(2,x.trainer_share/mx*100)}%"><span>${pfR(x.trainer_share)}</span></div>`).join("")}</div><div class="pf-lab">${bm.map(x=>`<span>${x.month}</span>`).join("")}</div><div class="muted" style="margin-top:8px">Counted in the month the money was received. Paid out with salary when the trainer has a staff record.</div>`)}}
function pfTrainerEdit(){const r=PF.data;$("pf-content").innerHTML=pfCard("Edit trainer",`<div class="grid">${pfField("name","Name",r.name)}${pfField("phone","Mobile",r.phone)}${pfSel("gender","Gender",r.gender||"Male",["Male","Female","Other"])}${pfField("specialization","Specialisation",r.specialization)}${pfField("joining_date","Joining date",r.joining_date,"date")}${pfSel("status","Status",r.status,["active","inactive"])}</div><div class="row"><button class="pr" onclick="pfTrainerSave()">Save</button><button onclick="pfTab('over')">Cancel</button><span style="flex:1"></span><button class="dg" onclick="pfTrainerRemove()">Remove trainer</button></div><div class="muted" style="margin-top:8px;font-size:12px">${r.staff_record?"This trainer is also a staff member. To stop listing them as a trainer, change their department in Staff.":"Remove deletes a trainer who was never used; one with bills or sessions is marked inactive instead, so old receipts keep their name."}</div>`)}
async function pfTrainerRemove(){if(!confirm(`Remove ${PF.data.name} from trainers?`))return;const j=await call("POST",`trainers/${PF.id}/remove/`,{});if(!j.ok)return pfSay(pfErrT(j));const n=PF.data.name;pfClose();if(typeof say==="function")say("gmsg",j.result==="deleted"?`Removed ${n}.`:`${n} has history, so they're marked inactive instead.`,true);if(typeof loadTrainers==="function")loadTrainers()}
async function pfTrainerSave(){const b={};["name","phone","gender","specialization","status"].forEach(k=>b[k]=pfGet(k));b.joining_date=pfGet("joining_date")||null;const j=await call("POST",`trainers/${PF.id}/update/`,b);if(!j.ok)return pfSay(pfErrT(j));await openTrainer(PF.id,"over");pfSay("Saved.",true);if(typeof loadTrainers==="function")loadTrainers()}

/* ---------------- STAFF ---------------- */
async function openStaff(id,tab,month){PF.kind="staff";PF.id=id;PF.tab=tab||"over";PF.month=month||PF.month||new Date().toISOString().slice(0,7);$("pf-content").innerHTML='<div class="muted">Loading…</div>';$("pf-msg").className="msg";pfShow();
 const j=await call("GET",`staff/${id}/?month=${PF.month}`);if(!j.ok){$("pf-content").innerHTML="";pfHead("Staff","",[]);return pfSay(pfErrT(j))}PF.data=j.staff;const s=j.staff;
 pfHead(s.name,`${pfE(s.code)} · ${pfE(s.designation)}${s.department?" · "+pfE(s.department):""} · ${pfChip(s.status)}`,[["over","Overview"],["att","Attendance"],...(s.payroll?[["pay","Payroll"],["hist","Advances & salary paid"]]:[])]);pfTab(PF.tab)}
const pfMonthPick=()=>`<div class="row" style="margin:0 0 12px"><label style="margin:0">Month</label><input type="month" value="${PF.month}" style="width:170px" onchange="openStaff(${PF.id},PF.tab,this.value)"></div>`;
function pfStaffTab(t){const s=PF.data,el=$("pf-content"),a=s.attendance,c=a.counts;
 if(t==="over"){el.innerHTML=pfKpis([["Present (this month)",c["Present"]+(c["Half Day"]?` + ${c["Half Day"]}½`:"")],["Absent",c["Absent"]],["Leave / off",c["Paid Leave"]+c["Weekly Off"]+c["Holiday"]],...(s.payroll?[["Monthly salary",pfR(s.monthly_salary)],["Earned so far",pfR(s.payroll.earned)]]:[])])+
  pfCard("Details",pfDl([["Staff code",pfE(s.code)],["Mobile",pfWa(s.phone)],["Gender",pfE(s.gender)],["Date of birth",pfE(s.date_of_birth)],["Designation",pfE(s.designation)],["Department",pfE(s.department)],["Joined",pfE(s.joining_date)],["Address",pfE(s.address)],["Emergency contact",pfE(s.emergency_contact)],
   ["Salary",s.payroll?`${pfR(s.monthly_salary)} · ${pfE(s.salary_basis)}`:'<span class="muted">Hidden for your role</span>'],["Sign-in login",s.login?`${pfE(s.login.name)} (${s.login.role})`:'<span class="muted">Not linked</span>'],
   ["Trainer record",s.trainer?(typeof openTrainer==="function"?`<span class="pf-open" onclick="openTrainer(${s.trainer.id})">${pfE(s.trainer.name)}: open trainer profile</span>`:pfE(s.trainer.name)):"—"]]),` <button class="sm" style="float:right" onclick="pfStaffEdit()">Edit</button>`)}
 else if(t==="att"){const first=new Date(a.days[0].date+"T00:00:00").getDay();const pad=(first+6)%7;
  el.innerHTML=pfMonthPick()+pfKpis(Object.entries(c).map(([k,v])=>[k,v]))+pfCard(`Attendance · ${a.month}`,`<div class="pf-cal">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div style="min-height:0;border:0;background:none;font-weight:600;color:var(--t2)">${d}</div>`).join("")}${"<div style='visibility:hidden'></div>".repeat(pad)}${a.days.map(d=>`<div class="${d.status?"s-"+d.status.split(" ")[0]:""}" title="${pfV(d.remarks)}"><b>${+d.date.slice(8)}</b>${d.status||'<span class="muted">·</span>'}${d.check_in?`<br><span class="muted">${d.check_in}–${d.check_out||""}</span>`:""}</div>`).join("")}</div><div class="muted" style="margin-top:8px">${a.marked} day(s) marked. Unmarked Sundays count as paid weekly off in payroll (v1.2.0 rule).</div>`)}
 else if(t==="pay"){const p=s.payroll;el.innerHTML=pfMonthPick()+pfKpis([["Paid days",p.paid_days],["Daily rate",pfR(p.daily_rate)],["Earned",pfR(p.earned)],["Advances",pfR(p.advance)],["PT commission due",pfR(p.pt_pending)],["Total to pay",pfR(p.total)]])+
  pfCard(`Payroll · ${p.month}`,pfDl([["Salary",`${pfR(p.staff.monthly_salary)} · ${p.staff.salary_basis}`],["Days counted",`${p.elapsed_days} of ${p.days_in_month} (÷ ${p.divisor})`],["Sundays added as weekly off",p.weekly_off_inferred],["Working days not marked",p.not_marked?`<span class="chip c-wn">${p.not_marked}: these earn nothing until marked</span>`:"None"],["Holidays paid?",p.holidays_paid?"Yes":"No (change in Settings)"],["Net salary",pfR(p.net)],["PT earned / already paid",`${pfR(p.pt_earned)} / ${pfR(p.pt_paid)}`],["Settled",p.settled?`${pfChip("Paid")} ${p.settled.payment_date} · ${pfR(p.settled.total)} · ${p.settled.mode}${p.settled.reference_no?" · "+pfE(p.settled.reference_no):""}`:pfChip("Pending")]]))}
 else if(t==="hist"){el.innerHTML=pfCard("Salary paid",`<table><thead><tr><th>Month</th><th>Salary</th><th>PT commission</th><th>Total</th><th>Paid on</th><th>Mode</th></tr></thead><tbody>${(s.settlements||[]).map(x=>`<tr><td>${x.month}</td><td>${pfR(x.salary)}</td><td>${pfR(x.pt_commission)}</td><td><b>${pfR(x.total)}</b></td><td>${x.payment_date}</td><td>${x.mode}</td></tr>`).join("")||`<tr><td colspan=6 class="muted">Nothing paid yet.</td></tr>`}</tbody></table>`)+
  pfCard("Salary advances",`<table><thead><tr><th>Date</th><th>Amount</th><th>Mode</th><th>Ref</th><th>Remarks</th></tr></thead><tbody>${(s.advances||[]).map(x=>`<tr><td>${x.date}</td><td>${pfR(x.amount)}</td><td>${pfE(x.mode)}</td><td>${pfE(x.reference_no)}</td><td>${pfE(x.remarks)}</td></tr>`).join("")||`<tr><td colspan=5 class="muted">No advances.</td></tr>`}</tbody></table>`)}}
function pfStaffEdit(){const s=PF.data;$("pf-content").innerHTML=pfCard("Edit staff",`<div class="grid">${pfField("name","Name",s.name)}${pfField("phone","Mobile",s.phone)}${pfSel("gender","Gender",s.gender||"Male",["Male","Female","Other"])}${pfField("date_of_birth","Date of birth",s.date_of_birth,"date")}${pfField("designation","Designation",s.designation)}${typeof DEPTS!=="undefined"?pfSel("department","Department",s.department,DEPTS.includes(s.department)?DEPTS:[s.department,...DEPTS]):pfField("department","Department",s.department)}${pfField("joining_date","Joining date",s.joining_date,"date")}${pfField("emergency_contact","Emergency contact",s.emergency_contact)}${pfSel("status","Status",s.status,["active","inactive"])}${s.payroll?pfField("monthly_salary","Monthly salary ₹",s.monthly_salary)+pfSel("salary_basis","Salary basis",s.salary_basis,["Calendar Days","Fixed 30 Days"]):""}${pfField("address","Address",s.address,"ta")}</div><div class="row"><button class="pr" onclick="pfStaffSave()">Save</button><button onclick="pfTab('over')">Cancel</button></div>`)}
async function pfStaffSave(){const s=PF.data,b={};["name","phone","gender","designation","department","emergency_contact","status","address"].forEach(k=>b[k]=pfGet(k));b.date_of_birth=pfGet("date_of_birth")||null;b.joining_date=pfGet("joining_date");
 if(s.payroll){b.monthly_salary=pfGet("monthly_salary");b.salary_basis=pfGet("salary_basis")}const j=await call("POST",`staff/${PF.id}/`,b);if(!j.ok)return pfSay(pfErrT(j));await openStaff(PF.id,"over");pfSay("Saved.",true);if(typeof loadStaff==="function")loadStaff()}
</script>
