<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Crestline control panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14122B;font-family:Inter,system-ui,sans-serif;color:#1D1B33}
.c{width:min(400px,92vw);background:#fff;border-radius:18px;padding:30px 28px}
.logo{width:44px;height:44px;border-radius:12px;background:#6D5DF6;color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;margin-bottom:14px}
h1{margin:0 0 4px;font-size:22px}p{margin:0 0 20px;color:#5F5C78}
label{display:grid;gap:5px;font-size:12.5px;font-weight:600;margin-bottom:14px}
input{font:inherit;height:44px;border:1px solid #E2E0EE;border-radius:10px;padding:0 12px}
input:focus{outline:2px solid #B3A9FF;border-color:#6D5DF6}
button{width:100%;height:46px;border:0;border-radius:10px;background:#6D5DF6;color:#fff;font:inherit;font-weight:600;cursor:pointer}
.err{background:#FDE3E3;color:#7F1D1D;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13px}
</style>
</head>
<body>
<form class="c" method="post">{% csrf_token %}
 <div class="logo">C</div>
 <h1>Crestline control panel</h1>
 <p>FitDesk Pro · for Crestline only</p>
 {% if err %}<div class="err">{{ err }}</div>{% endif %}
 <input type="hidden" name="next" value="{{ next }}">
 <label>Username<input name="username" autocomplete="username" autofocus required></label>
 <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
 <button type="submit">Sign in</button>
</form>
</body>
</html>
