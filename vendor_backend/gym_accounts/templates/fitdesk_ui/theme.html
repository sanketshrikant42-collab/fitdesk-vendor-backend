<!-- FitDesk shared theme: colour tokens (light + dark), base components and the theme switch.
     Include it inside <head> of every test page (see gym_core/app.html). -->
<script>
/* Pick the theme before the page paints: saved choice, else the computer's setting. */
(function(){var t=null;try{t=localStorage.getItem("fd_theme")}catch(e){}
 if(t!=="light"&&t!=="dark")t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
 document.documentElement.setAttribute("data-theme",t)})();
function fdTheme(){return document.documentElement.getAttribute("data-theme")||"light"}
function fdToggleTheme(){var t=fdTheme()==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("fd_theme",t)}catch(e){}fdThemeLabel()}
function fdThemeLabel(){document.querySelectorAll("[data-theme-btn]").forEach(function(b){var d=fdTheme()==="dark";b.innerHTML=(d?'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>')+"<span>"+(d?"Light mode":"Dark mode")+"</span>";b.title="Switch to "+(d?"light":"dark")+" mode"})}
document.addEventListener("DOMContentLoaded",fdThemeLabel);
</script>
<style>
:root,:root[data-theme="light"]{
 --p:#6C5CE7;--pd:#5545D0;--pl:#EEEAFE;--p-t:#5545D0;--on-p:#fff;
 --bg:#F4F5FA;--surface:#FFFFFF;--surface2:#F8F9FC;--hover:#F4F2FF;--row:#EEF0F4;
 --t1:#172033;--t2:#5F6B80;--t3:#98A2B3;--bd:#E3E6EC;--bd2:#D0D5DD;
 --ok:#16B364;--okl:#E7F8EE;--ok-t:#08804A;--wn:#F79009;--wnl:#FFF3E2;--wn-t:#B54708;--dg:#F04438;--dgl:#FFEFEC;--dg-t:#C4320A;
 --nav:#0E1526;--nav2:#1B2540;--nav-t:#8B96B3;--shadow:0 1px 2px rgba(16,24,40,.05);--shadow-lg:0 20px 50px rgba(16,24,40,.18);
 --overlay:rgba(14,21,38,.45);color-scheme:light}
:root[data-theme="dark"]{
 --p:#7C6CF2;--pd:#6A59E8;--pl:#272153;--p-t:#B9AEFF;--on-p:#fff;
 --bg:#0B1020;--surface:#131A2D;--surface2:#182036;--hover:#1D2440;--row:#1E2740;
 --t1:#E7EAF3;--t2:#9AA4BA;--t3:#6B7591;--bd:#252F4A;--bd2:#33405F;
 --ok:#22C55E;--okl:#0F2C20;--ok-t:#5EE09A;--wn:#F5A524;--wnl:#33250E;--wn-t:#FBBF5A;--dg:#F25555;--dgl:#3A1518;--dg-t:#FF8A80;
 --nav:#070B17;--nav2:#161D33;--nav-t:#8590AD;--shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 24px 60px rgba(0,0,0,.55);
 --overlay:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--t1);font-size:13px;line-height:1.45;transition:background .15s,color .15s}
h2{margin:0 0 2px;font-size:20px;letter-spacing:-.01em}.sub{color:var(--t2);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:14px}
label{display:block;font-size:11px;font-weight:600;color:var(--t2);margin-bottom:4px}
input,select,textarea{width:100%;height:36px;border:1px solid var(--bd2);border-radius:9px;padding:0 10px;font:inherit;background:var(--surface);color:var(--t1);outline:none}
textarea{height:72px;padding:8px 10px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--pl)}
input::placeholder,textarea::placeholder{color:var(--t3)}
button{height:34px;border-radius:9px;border:1px solid var(--bd2);background:var(--surface);color:var(--t1);padding:0 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap}
button:hover{background:var(--hover)}
button.pr{background:var(--p);border-color:var(--p);color:var(--on-p)}button.pr:hover{background:var(--pd)}
button.dg{color:var(--dg-t);border-color:var(--dg)}button.sm{height:28px;padding:0 10px;font-size:12px}
button.ghost{border-color:transparent;background:transparent}button.ghost:hover{background:var(--hover)}
button:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--t2);font-size:11px;font-weight:600;padding:8px;border-bottom:1px solid var(--bd);background:var(--surface2);text-transform:uppercase;letter-spacing:.03em}
td{padding:9px 8px;border-bottom:1px solid var(--row);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--hover)}
.chip{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--row);color:var(--t2);white-space:nowrap}
.c-ok{background:var(--okl);color:var(--ok-t)}.c-wn{background:var(--wnl);color:var(--wn-t)}.c-dg{background:var(--dgl);color:var(--dg-t)}.c-p{background:var(--pl);color:var(--p-t)}
.msg{margin-top:10px;padding:9px 12px;border-radius:9px;font-size:12.5px;display:none;white-space:pre-wrap}.msg.show{display:block}
.msg.ok{background:var(--okl);color:var(--ok-t)}.msg.err{background:var(--dgl);color:var(--dg-t)}
.muted{color:var(--t2)}.hidden{display:none}
a.link{color:var(--p-t);font-weight:600;word-break:break-all}
.theme-btn{height:32px;font-size:12px;padding:0 11px}
</style>
